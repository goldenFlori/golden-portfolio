name = "f1-lakehouse-proxy"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Bound as env.PIPELINE_KV — stores the rate-limit timestamp and the cached
# result of the last successful run. Create with:
#   wrangler kv namespace create PIPELINE_KV
# then paste the returned id below.
[[kv_namespaces]]
binding = "PIPELINE_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Non-secret config — safe to commit. Secrets (DATABRICKS_TOKEN) are set with
# `wrangler secret put`, never written here. See README.md.
[vars]
ALLOWED_ORIGIN = "https://goldenflori.github.io"
DATABRICKS_JOB_ID = "REPLACE_WITH_JOB_ID"
DATABRICKS_WAREHOUSE_ID = "REPLACE_WITH_WAREHOUSE_ID"
DATABRICKS_HOST = "REPLACE_WITH_WORKSPACE_HOST"
DATABRICKS_CATALOG = "formula1"
RATE_LIMIT_MS = "3600000"

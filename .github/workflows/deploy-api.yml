name: Build & Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# Keyless OIDC auth to Azure — no long-lived credential stored anywhere.
# One-time setup (federated credential + role assignment) is documented in
# api/README.md; this workflow only needs the three IDs below as repo secrets.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: api
        run: dotnet restore

      - name: Build
        working-directory: api
        run: dotnet build --no-restore --configuration Release

      - name: Test
        working-directory: api
        run: dotnet test --no-build --configuration Release

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # container-apps-deploy-action doesn't call `az acr login` on its own
      # when relying on OIDC/RBAC (only when given a registry
      # username/password) — without this, its internal `docker push` fails
      # unauthorized. This reuses the OIDC session above (AcrPush role,
      # no stored credential) rather than an ACR admin password.
      - name: Log in to Azure Container Registry
        env:
          REGISTRY: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
        run: az acr login --name ${REGISTRY%%.*}

      # Builds api/src/Api/Dockerfile, pushes to the registry, and updates
      # the Container App to the new image — min-replicas/ingress/secrets
      # stay whatever they were last configured to (see api/README.md for
      # the one-time `az containerapp` setup, including wiring
      # DATABRICKS_TOKEN in as a Container Apps secret — that's a separate,
      # one-time step from this workflow, not something CI re-applies).
      - uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/api/src/Api
          dockerfilePath: Dockerfile
          registryUrl: ${{ secrets.AZURE_CONTAINER_REGISTRY }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
